name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn websockets==15.0.1 rpyc==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: bash -n docker/init-app.sh config/start_all.sh
